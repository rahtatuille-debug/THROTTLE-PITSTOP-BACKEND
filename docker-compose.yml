services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No host port on purpose: web reaches Postgres over the compose
    # network (POSTGRES_HOST=db), and publishing 5432 clashes with any
    # Postgres already installed on the machine.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    volumes:
      - .:/app
      - media_data:/app/media
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    ports:
      - "8000:8000"
    # Wait until Postgres accepts connections, so migrate doesn't race it
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
